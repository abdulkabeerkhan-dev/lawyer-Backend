<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Legal retrieval pipeline</title>
  <desc id="desc">Detailed retrieval flow from legal issue planning through parallel statutory, semantic, lexical, exact, full-text, and official-web searches, fusion, legal filtering, verification, bounded evidence, and answer generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526179; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #42526b; }
      .tiny { font-size: 12px; fill: #526179; }
      .box { stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edgeGreen { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="54" y="58" class="title">Legal Retrieval Pipeline — From Question to Admissible Evidence</text>
  <text x="56" y="86" class="subtitle">Search returns candidates; legal and source checks decide what may support the answer</text>

  <rect x="45" y="120" width="1510" height="835" class="section"/>
  <rect x="85" y="155" width="300" height="95" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="235" y="190" text-anchor="middle" class="label">Question + context</text>
  <text x="235" y="215" text-anchor="middle" class="small">facts · requested relief · follow-up history</text>

  <rect x="485" y="145" width="385" height="115" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="677" y="179" text-anchor="middle" class="label">Legal query planner</text>
  <text x="677" y="204" text-anchor="middle" class="small">domain · issues · statutes · forum · province</text>
  <text x="677" y="228" text-anchor="middle" class="small">procedure · binding courts · ambiguity</text>
  <path d="M385 202 H479" class="edge"/>

  <rect x="970" y="145" width="500" height="115" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1220" y="180" text-anchor="middle" class="label">Create bounded search lanes</text>
  <text x="1220" y="205" text-anchor="middle" class="small">one precise query per issue / search purpose</text>
  <text x="1220" y="229" text-anchor="middle" class="small">preserve lane, query, source, and rank metadata</text>
  <path d="M870 202 H964" class="edge"/>

  <rect x="85" y="305" width="1430" height="348" class="section"/>
  <text x="110" y="338" class="label">PARALLEL CANDIDATE RETRIEVAL</text>

  <rect x="115" y="370" width="245" height="90" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="237" y="405" text-anchor="middle" class="label">Exact statute / citation</text>
  <text x="237" y="430" text-anchor="middle" class="small">canonical IDs · direct references</text>

  <rect x="390" y="370" width="245" height="90" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="512" y="405" text-anchor="middle" class="label">Dense semantic</text>
  <text x="512" y="430" text-anchor="middle" class="small">concepts · analogous legal issues</text>

  <rect x="665" y="370" width="245" height="90" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="787" y="405" text-anchor="middle" class="label">Sparse lexical / BM25</text>
  <text x="787" y="430" text-anchor="middle" class="small">terms · phrases · citations</text>

  <rect x="940" y="370" width="245" height="90" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1062" y="405" text-anchor="middle" class="label">Full-text / metadata</text>
  <text x="1062" y="430" text-anchor="middle" class="small">case ID · court · date · exact text</text>

  <rect x="1215" y="370" width="245" height="90" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1337" y="405" text-anchor="middle" class="label">Official-source search</text>
  <text x="1337" y="430" text-anchor="middle" class="small">leads only until source-verified</text>

  <path d="M1220 260 V282 H237 V364" class="edge"/>
  <path d="M1220 260 V289 H512 V364" class="edge"/>
  <path d="M1220 260 V296 H787 V364" class="edge"/>
  <path d="M1220 260 V303 H1062 V364" class="edge"/>
  <path d="M1220 260 V364" class="edge"/>

  <path d="M237 460 V490 H760" class="edge"/>
  <path d="M512 460 V490 H760" class="edge"/>
  <path d="M787 460 V490" class="edge"/>
  <path d="M1062 460 V490 H815" class="edge"/>
  <path d="M1337 460 V490 H815" class="edge"/>

  <rect x="600" y="490" width="325" height="90" class="box" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="762" y="525" text-anchor="middle" class="label">Normalize and deduplicate</text>
  <text x="762" y="550" text-anchor="middle" class="small">case identity · chunk collapse · source lineage</text>

  <rect x="1030" y="490" width="400" height="90" class="box" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="1230" y="525" text-anchor="middle" class="label">Source and provider health ledger</text>
  <text x="1230" y="550" text-anchor="middle" class="small">success · empty · timed out · unavailable · invalid credentials</text>
  <path d="M925 535 H1024" class="edge"/>

  <path d="M760 580 V687" class="edgeGreen"/>
  <rect x="550" y="687" width="420" height="84" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="760" y="721" text-anchor="middle" class="label">Fuse and rank candidate set</text>
  <text x="760" y="746" text-anchor="middle" class="small">RRF + legal relevance + authority context</text>

  <path d="M970 729 H1010" class="edgeGreen"/>
  <rect x="1015" y="687" width="430" height="84" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1230" y="721" text-anchor="middle" class="label">Legal hard filters and reranking</text>
  <text x="1230" y="746" text-anchor="middle" class="small">domain · jurisdiction · court · treatment · date</text>

  <path d="M1230 771 V805 H1045" class="edgeGreen"/>
  <rect x="610" y="805" width="435" height="92" class="box" fill="#fdf2f8" stroke="#f472b6"/>
  <text x="827" y="840" text-anchor="middle" class="label">Verify source integrity and law currency</text>
  <text x="827" y="865" text-anchor="middle" class="small">citation ↔ case · text / ratio · amendments / jurisdiction</text>

  <path d="M610 851 H570" class="edgeGreen"/>
  <rect x="145" y="805" width="420" height="92" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="355" y="840" text-anchor="middle" class="label">Bounded, traceable evidence pack</text>
  <text x="355" y="865" text-anchor="middle" class="small">only admitted items receive evidence IDs</text>

  <path d="M355 805 V785 H130 V715 H150" class="edge"/>
  <rect x="85" y="665" width="320" height="80" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="245" y="699" text-anchor="middle" class="label">Insufficient or failed?</text>
  <text x="245" y="723" text-anchor="middle" class="small">clarify · bounded retry · disclose limits</text>

  <text x="75" y="935" class="tiny">Answer generation should cite only admitted evidence IDs. Retrieval failures must remain distinct from genuine zero-result searches.</text>
</svg>
